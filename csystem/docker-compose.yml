services:
  csystem:
    build: .
    image: thanvasu/web-cssystem:local
    # ดึงรหัสจากไฟล์ .env อัตโนมัติ (ไฟล์นี้อยู่นอก Git)
    env_file:
      - .env
    environment:
      DOCKER: "1"
      HOST: "0.0.0.0"
      PORT: "3000"
      SERVE_FRONTEND: "1"
      FRONTEND_ROOT: /app/frontend
      ODBC_DRIVER: "ODBC Driver 18 for SQL Server"
      # localhost ใช้ HTTP — ปิด Secure cookie
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      # โฟลเดอร์รูปใน container (ต้องตรงกับ volume ด้านล่าง)
      UPLOAD_ROOT: /app/backend/uploads
    ports:
      # ใช้ 3001 บนเครื่อง (เลี่ยงชนแอปอื่นที่พอร์ต 3000)
      - "${HOST_PORT:-3001}:3000"
    volumes:
      # สำคัญ: เก็บรูปถาวร — ไม่หายตอน rebuild / redeploy
      # Coolify: ตั้ง Persistent Storage → Destination = /app/backend/uploads
      - type: volume
        source: csystem_uploads
        target: /app/backend/uploads
        volume:
          nocopy: true
    restart: unless-stopped

volumes:
  csystem_uploads:
    name: csystem_uploads
    labels:
      app: csystem
      purpose: shop-images
